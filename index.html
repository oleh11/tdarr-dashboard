<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcode Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23e5a00d%22%2F%3E%3Cpath%20d%3D%22M25%2019v26l18-13z%22%20fill%3D%22%231f2326%22%2F%3E%3Cpath%20d%3D%22M10%2025l6%207-6%207M54%2025l-6%207%206%207%22%20fill%3D%22none%22%20stroke%3D%22%231f2326%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{--bg:#1f2326;--bg2:#282c30;--card:#2f3438;--tx:#eaecee;--mu:#9aa0a6;--gold:#e5a00d;--ok:#4ade80;--bd:#3a4045}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px "Open Sans",system-ui,sans-serif}
header{flex-wrap:wrap;gap:8px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#191c1f;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:20px;letter-spacing:.02em}.logo b{color:var(--gold)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mu);font-size:13px}.stats span b{color:var(--tx);font-size:16px;margin-right:4px}
main{padding:18px 16px 60px}h2{font-size:19px;font-weight:600;margin:26px 0 12px}
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:16px}
.now{display:flex;gap:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px;position:relative;overflow:hidden}
.now .po{width:110px;aspect-ratio:2/3;border-radius:6px;flex:none;background:var(--card) center/cover}
.now .i{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mu);font-size:13px;margin:3px 0 12px}
.bar{height:8px;background:#444b51;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .8s;background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);background-size:200% 100%;animation:sh 1.8s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.m{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:8px}.pct{color:var(--gold);font-weight:700;font-size:22px;margin-bottom:6px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.p{width:140px;flex:none}.p .im{width:140px;height:210px;border-radius:6px;background:var(--card) center/cover;position:relative;border:1px solid var(--bd)}
.p .nm{margin-top:7px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p .sb{color:var(--mu);font-size:12px}
.badge{position:absolute;top:6px;right:6px;background:var(--gold);color:#111;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px}
.badge.ok{background:var(--ok)}.qn{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:3px;font-size:11px}
.empty{color:var(--mu);background:var(--bg2);border:1px dashed var(--bd);border-radius:8px;padding:22px;text-align:center}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:30px}
#st{color:var(--mu);font-size:12px;margin-top:20px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.rc{position:relative;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.rc .l{color:var(--mu);font-size:12px}.rc .v{font-size:22px;font-weight:700;margin:2px 0 6px}.rc .v small{font-size:13px;color:var(--mu);font-weight:600}
.rc .g{height:6px;background:#444b51;border-radius:3px;overflow:hidden}.rc .g i{display:block;height:100%;background:var(--gold);transition:width .8s}
.rc .n{color:var(--mu);font-size:11px;margin-top:6px}
.brand{display:inline-flex;align-items:center;gap:5px;font:800 11px/1 system-ui,sans-serif;letter-spacing:.04em;padding:4px 8px;border-radius:4px;color:#fff;white-space:nowrap;position:absolute;top:10px;right:10px}
.brand.nv{background:#76b900;color:#111}.brand.in{background:#0068b5}.brand.am{background:#111;border:1px solid #ed1c24;box-shadow:inset 3px 0 0 #ed1c24}
.brand svg{width:12px;height:12px}

.logo{display:flex;align-items:center;gap:10px}.logo .lg{width:30px;height:30px;flex:none}
.rel{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:34px 0 4px}
.tg{display:inline-flex;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;overflow:hidden}
.tg i{font-style:normal;display:inline-flex;align-items:center;gap:7px;padding:9px 12px}
.tg .l{background:#3a3f44;color:#d6d9dc}.tg .v{color:#fff}
.tg .dk{background:#0e1114}.tg .wh{background:#fff;color:#1f2326}.tg .gn{background:#3c873a}
.tg .bl{background:#1d9bf0}.tg .am{background:#d98e04;color:#111}.tg .tl{background:#2fb4a4;color:#06201c}
</style></head><body>
<header><div class="logo"><svg class="lg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5b82e"/><stop offset="1" stop-color="#d98e04"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lgg)"/><path d="M25 19v26l18-13z" fill="#1f2326"/><path d="M10 25l6 7-6 7M54 25l-6 7 6 7" fill="none" stroke="#1f2326" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>tdarr<b>flix</b></span></div>
<div class="stats"><span><b id="d">–</b>converted</span><span title="Files still to convert (queued plus in progress), with progress and an estimated time to finish at the last hour's pace"><b id="lf">–</b>left</span><span><b id="sv">–</b>saved</span><span><b id="f">–</b>failed</span><span title="Disk space freed, valued at the price per GB of a new drive (set with DRIVE_PRICE and DRIVE_TB)"><b id="dv">–</b>disk value saved</span><span title="Estimated extra electricity vs idle, at your electricity price (set with KWH_PRICE)"><b id="pw">–</b>est. power</span></div></header>
<main>
<div class="res" id="res"></div>
<h2>Now transcoding</h2><div class="hero" id="now"></div>
<h2>Up next</h2><div class="row" id="queue"></div>
<h2>Recently converted</h2><div class="row" id="done"></div>
<div class="rel"><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M1.5 1.5h5.6l7.4 7.4-5.6 5.6-7.4-7.4zm3 2.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/></svg>Release</i><i class="v dk">V1.1.0</i></span><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M3 1.5h6.5L13 5v9.5H3zm6 .9V5.5h3.1z"/></svg>License</i><i class="v wh">MIT</i></span><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 1l6.2 3.6v6.8L8 15 1.8 11.4V4.6z"/></svg>Node</i><i class="v gn">18+</i></span><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Tdarr</i><i class="v bl">3.x</i></span><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 1l6 3v8l-6 3-6-3V4zm0 1.9L4.3 4.7 8 6.5l3.7-1.8z"/></svg>Dependencies</i><i class="v am">0</i></span><span class="tg"><i class="l"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M5 5h6v6H5zM6.5 1.5h1v2h-1zm2 0h1v2h-1zM6.5 12.5h1v2h-1zm2 0h1v2h-1zM1.5 6.5h2v1h-2zm0 2h2v1h-2zM12.5 6.5h2v1h-2zm0 2h2v1h-2z"/></svg>Encoders</i><i class="v tl">NVENC · QSV</i></span></div>
<div id="st"></div></main>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=x=>x.poster?`style="background-image:url('${esc(x.poster)}')"`:'';
const ph=x=>x.poster?'':`<div class="ph" style="height:100%">${x.kind==='tv'?'📺':'🎬'}</div>`;
const label=x=>esc(x.title)+(x.ep?'':'');
const sub=x=>x.ep?x.ep:(x.year||'');
async function tick(){try{const d=await (await fetch('data')).json();if(d.error)throw d.error;
$("d").textContent=d.doneCount;
const eta=d.etaH==null?'':d.etaH>=48?' · ~'+(d.etaH/24).toFixed(1)+' days':' · ~'+d.etaH.toFixed(0)+' h';
$("lf").textContent=d.left.toLocaleString()+' of '+d.total.toLocaleString()+' ('+(100*(d.total-d.left)/Math.max(d.total,1)).toFixed(0)+'% done'+eta+')';
const BR={nvidia:'<span class="brand nv" title="NVIDIA"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12c3-5 7-7 10-7s7 2 10 7c-3 5-7 7-10 7S5 17 2 12zm10-4a4 4 0 100 8 4 4 0 000-8z"/></svg>NVIDIA</span>',intel:'<span class="brand in" title="Intel">intel</span>',amd:'<span class="brand am" title="AMD">AMD</span>'};
const brand=v=>BR[v]||'';
const card=(l,v,pct,n,b)=>`<div class="rc">${b||''}<div class="l">${l}</div><div class="v">${v}</div><div class="g"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div><div class="n">${esc(n)}</div></div>`;
const pc=d.pc,ho=d.host;
$("res").innerHTML=
 (pc?card('PC power (total, est.)',pc.totalW+' <small>W</small>',pc.totalW/6,'GPU '+Math.round(pc.gpuW)+' W measured, CPU and system estimated',brand(pc.gpuVendor)):'')+
 (pc?card('PC graphics card',Math.round(pc.gpu)+'<small>% GPU</small>',pc.gpu,'encoder '+Math.round(pc.enc)+'% · decoder '+Math.round(pc.dec)+'% · '+pc.vramGB.toFixed(1)+' GB memory',brand(pc.gpuVendor)):'')+
 (pc?card('PC processor',Math.round(pc.cpu)+'<small>% CPU</small>',pc.cpu,(pc.cpuName||'all cores'),brand(pc.cpuVendor)):'')+
 (ho?card('Server',ho.cpu+'<small>% CPU</small>',ho.cpu,'disk wait '+ho.wait+'% · load '+ho.load.toFixed(1)+(ho.cpuName?' · '+ho.cpuName:''),brand(ho.vendor)):'')+
 card('Pace',d.rate.toFixed(1)+' <small>files/hour</small>',Math.min(100,d.rate*2),'average over the last hour');
$("f").textContent=d.failed;$("sv").textContent=Math.round(d.savedGB).toLocaleString()+" GB · "+(d.savedGB/1000).toFixed(2)+" TB";$("dv").textContent="$"+(d.savedGB*d.perGB).toFixed(0);$("pw").textContent=d.kwh.toFixed(1)+" kWh · $"+d.cost.toFixed(2);
$('now').innerHTML=d.workers.length?d.workers.map(w=>`<div class="now">${brand((d.nodeBrand||{})[w.node])}<div class="po" ${bg(w)}>${ph(w)}</div><div class="i"><div class="t">${label(w)}</div><div class="s">${sub(w)} ${w.res?'· '+w.res:''} · ${esc(w.node)}</div><div class="pct">${w.pct.toFixed(0)}%</div><div class="bar"><i style="width:${w.pct}%"></i></div><div class="m"><span>${Math.round(w.fps)} fps</span><span>ETA ${esc(w.eta)}</span></div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Nothing transcoding right now</div>';
$('queue').innerHTML=d.queue.length?d.queue.map((x,i)=>`<div class="p"><div class="im" ${bg(x)}>${ph(x)}<span class="qn">#${i+1}</span></div><div class="nm">${label(x)}</div><div class="sb">${sub(x)} · ${x.gb.toFixed(1)} GB</div></div>`).join(''):'<div class="empty" style="width:100%">Queue is empty</div>';
$('done').innerHTML=d.done.length?d.done.map(x=>`<div class="p"><div class="im" ${bg(x)}>${ph(x)}<span class="badge ok">HEVC</span></div><div class="nm">${label(x)}</div><div class="sb">${sub(x)} · ${x.gb.toFixed(1)} GB</div></div>`).join(''):'<div class="empty" style="width:100%">Nothing yet</div>';
$('st').textContent='Updated '+new Date(d.t).toLocaleTimeString();}catch(e){$('st').textContent='Error: '+e}}
tick();setInterval(tick,3000);
</script></body></html>
